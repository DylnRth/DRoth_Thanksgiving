<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harvest Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Lora:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- navbar -->
    <nav class="navbar bg-1 fg-2 navColor">
      <div class="container-fluid">
        <a class="navbar-brand navLogo" href="#">
          <img src="img/turkey_table (1).svg" alt="Logo">
        </a>
      </div>
    </nav>

    <main>
      <section class="event-banner">
        <div class="container-fluid p-0">
          <div class="row g-0 align-items-stretch">
            <div class="col-12 col-md-7 col-lg-7 event-details d-flex flex-column justify-content-center">
              <h1>THANKSGIVING<br>HARVEST TABLE</h1>
              <h2>2:30pm - 5:30pm &nbsp;11/26/26</h2>
              <h3>Marlboro Recreation Center</h3>
              <p>
                Every ticket purchased and dollar donated to Harvest Table goes directly to the Harvest Hands Food Bank of Monmouth to feed local kids and families.
              </p>
            </div>

            <div class="col-12 col-md-5 col-lg-5 event-photo-wrapper">
              <img src="img/paper_bag.svg" alt="Food Donation in brown paper bag" class="event-photo">
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
